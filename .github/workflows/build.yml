name: Deploy Zola site to Pages

on:
  push:
    branches:
      - zola

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and deploy
        uses: shalzz/zola-deploy-action@v0.21.1
        env:
          PAGES_BRANCH: gh-pages
          BUILD_DIR: src
          OUT_DIR: deploy
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
